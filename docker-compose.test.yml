# ── docker-compose.test.yml ──────────────────────────────────
# Auto TLS via sslip.io. No DNS setup needed.
#
# Usage:
#   DOMAIN=<server-ip>.sslip.io docker compose -f docker-compose.test.yml up -d
#
# Access:
#   Site + shop: https://shroom-mates.<server-ip>.sslip.io
#   Old shop host (redirects only): https://shop.<server-ip>.sslip.io
#   Medusa:     https://api.<server-ip>.sslip.io

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro
      - test_caddy_logs:/var/log/caddy
    depends_on:
      medusa:
        condition: service_started
      web:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-shroom-mates}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-shroom-mates}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - test_redis_data:/data

  medusa:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Allows "Manuelle Zahlung (Test)" (orders without payment); off in production
      ALLOW_MANUAL_PAYMENT: ${ALLOW_MANUAL_PAYMENT:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shroom-mates}?sslmode=disable
      REDIS_URL: redis://redis:6379
      MEDUSA_BACKEND_URL: https://api.${DOMAIN}
      STORE_CORS: https://shroom-mates.${DOMAIN}
      ADMIN_CORS: https://api.${DOMAIN}
      AUTH_CORS: https://api.${DOMAIN},https://shroom-mates.${DOMAIN}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SUMUP_API_KEY: ${SUMUP_API_KEY:-}
      SUMUP_MERCHANT_CODE: ${SUMUP_MERCHANT_CODE:-}
      # Derived from DOMAIN so they can't drift from the real hosts (the
      # redirect_url must be on the site host).
      SUMUP_MEDUSA_URL: https://api.${DOMAIN}
      SUMUP_REDIRECT_URL: https://shroom-mates.${DOMAIN}/shop/checkout/complete
      SUMUP_REDIRECT_ALLOWED_HOSTS: ${SUMUP_REDIRECT_ALLOWED_HOSTS:-}
      # Transactional email via Resend (mails are only logged without a key)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-shroom-mates <bestellung@shroom-mates.de>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-hey@shroom-mates.de}
      SHOP_NOTIFICATION_EMAIL: ${SHOP_NOTIFICATION_EMAIL:-hey@shroom-mates.de}
      SHOP_PUBLIC_URL: https://shroom-mates.${DOMAIN}
    volumes:
      - test_medusa_uploads:/app/static
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_MEDUSA_BACKEND_URL: https://api.${DOMAIN}
        PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
        PUBLIC_SITE_URL: https://shroom-mates.${DOMAIN}
        # Optional: set to the Umami website ID to enable the tracker
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_MEDUSA_BACKEND_URL: https://api.${DOMAIN}
      MEDUSA_INTERNAL_URL: http://medusa:9000
      APP_TRUST_PROXY: "true"
    depends_on:
      - medusa

  # ── Analytics (Umami, cookieless, self-hosted) ─────────────────
  # Creates the "umami" database on the existing postgres once (init scripts do
  # not run on existing volumes), then exits.
  umami-db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-medusa}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1
        || psql -c "CREATE DATABASE umami"
    depends_on:
      postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    mem_limit: 768m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-${COOKIE_SECRET}}
      # Only the tracker is public (Caddy proxies exactly these two paths)
      TRACKER_SCRIPT_NAME: /stats/s.js
      COLLECT_API_ENDPOINT: /stats/e
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    # Dashboard: host loopback only, reach it via SSH tunnel (see DEPLOYMENT.md)
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      umami-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  test_caddy_logs:
  test_postgres_data:
  test_redis_data:
  test_medusa_uploads:
