# ── docker-compose.yml ───────────────────────────────────────
# The server stack (site + shop, Medusa, Postgres, Redis, Umami, Caddy).
# Environments differ only in variables: DOMAIN, ROBOTS_TAG, ALLOW_MANUAL_PAYMENT,
# the SumUp keys (sandbox or live) and the secrets in .env (see .env.example).
# The deploy workflow sets them; by hand:
#   DOMAIN=staging.shroom-mates.de docker compose up -d
#
# Hosts: https://<DOMAIN> (site + shop), https://api.<DOMAIN> (Medusa + admin),
# shop.<DOMAIN> and www.<DOMAIN> redirect to the site.

# Pinned so the volume names below stay stable whatever the checkout folder is.
name: shroom-mates

services:
  # ── Reverse Proxy ──────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ROBOTS_TAG: ${ROBOTS_TAG:-all}
      CSP_HEADER: ${CSP_HEADER:-Content-Security-Policy}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates (Let's Encrypt), keep across deploys
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      medusa:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Admin API inside the container; the sites themselves only answer on their hostnames
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-shroom-mates}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-shroom-mates}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host — only accessible via internal network

  # ── Cache / Sessions ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: Medusa keeps workflow and event state in Redis; evicting it loses data
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Medusa Backend ─────────────────────────────────────────────
  medusa:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # "true" allows "Manuelle Zahlung (Test)" (orders without payment); never in production
      ALLOW_MANUAL_PAYMENT: ${ALLOW_MANUAL_PAYMENT:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shroom-mates}?sslmode=disable
      REDIS_URL: redis://redis:6379
      MEDUSA_BACKEND_URL: https://api.${DOMAIN}
      STORE_CORS: https://${DOMAIN}
      ADMIN_CORS: https://api.${DOMAIN}
      AUTH_CORS: https://api.${DOMAIN},https://${DOMAIN}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SUMUP_API_KEY: ${SUMUP_API_KEY:-}
      SUMUP_MERCHANT_CODE: ${SUMUP_MERCHANT_CODE:-}
      # Derived from DOMAIN so they can't drift from the real hosts (the
      # redirect_url must be on the site host).
      SUMUP_MEDUSA_URL: https://api.${DOMAIN}
      SUMUP_REDIRECT_URL: https://${DOMAIN}/shop/checkout/complete
      SUMUP_REDIRECT_ALLOWED_HOSTS: ${SUMUP_REDIRECT_ALLOWED_HOSTS:-}
      # Transactional email via Resend (mails are only logged without a key)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-shroom-mates <bestellung@shroom-mates.de>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-hey@shroom-mates.de}
      SHOP_NOTIFICATION_EMAIL: ${SHOP_NOTIFICATION_EMAIL:-hey@shroom-mates.de}
      SHOP_PUBLIC_URL: https://${DOMAIN}
    volumes:
      - medusa_uploads:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Web (Astro: prerendered site + SSR shop) ───────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_MEDUSA_BACKEND_URL: https://api.${DOMAIN}
        PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
        PUBLIC_SITE_URL: https://${DOMAIN}
        # Optional: set to the Umami website ID to enable the tracker
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_MEDUSA_BACKEND_URL: https://api.${DOMAIN}
      MEDUSA_INTERNAL_URL: http://medusa:9000
      APP_TRUST_PROXY: "true"
    depends_on:
      medusa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Analytics (Umami, cookieless, self-hosted) ─────────────────
  # Creates the "umami" database on the existing postgres once (init scripts do
  # not run on existing volumes), then exits.
  umami-db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-medusa}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1
        || psql -c "CREATE DATABASE umami"
    depends_on:
      postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    mem_limit: 768m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-${COOKIE_SECRET}}
      # Only the tracker is public (Caddy proxies exactly these two paths)
      TRACKER_SCRIPT_NAME: /stats/s.js
      COLLECT_API_ENDPOINT: /stats/e
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    # Dashboard: host loopback only, reach it via SSH tunnel (see DEPLOYMENT.md)
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      umami-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# The data volumes keep the names of the former test setup, so the server's
# existing database, Redis data and uploads carry over.
volumes:
  postgres_data:
    name: shroom-mates_test_postgres_data
  redis_data:
    name: shroom-mates_test_redis_data
  medusa_uploads:
    name: shroom-mates_test_medusa_uploads
  caddy_logs:
    name: shroom-mates_test_caddy_logs
  caddy_data:
  caddy_config:
