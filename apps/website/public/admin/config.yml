# Sveltia CMS Konfiguration für shroom-mates.de
# Doku: https://sveltiacms.app/en/docs
# Schema-Quelle der Wahrheit: src/content.config.ts (Zod) und src/content/**
# Alle Pfade sind relativ zum Repository-Root (Monorepo: apps/website/...).

backend:
  name: github
  repo: meister-eder/shroom-mates
  # TODO: auf `main` umstellen, sobald die Produktion live geht.
  branch: shop


# Ausgabe so nah wie möglich am bestehenden Stil halten (minimale Diffs):
# Strings in doppelten Anführungszeichen, leere optionale Felder weglassen
# (Zod `.optional()` akzeptiert nur fehlende Properties, keine leeren Strings).
output:
  omit_empty_optional_fields: true
  yaml:
    quote: double

slug:
  encoding: ascii
  clean_accents: true

# Fallback (wird von allen Collections unten überschrieben).
# Astro `image()` löst Bilder relativ zur Content-Datei auf, siehe media_folder je Collection.
media_folder: /apps/website/src/assets/images
public_folder: /assets/images

collections:
  # ---------------------------------------------------------------------------
  # Seiten (je eine Datei)
  # ---------------------------------------------------------------------------
  - name: pages
    label: Seiten
    label_singular: Seite
    icon: article
    # Relative Pfade: aufgelöst gegen den Ordner der jeweiligen Datei
    # (apps/website/src/content/<seite>/ + ../../assets/images = apps/website/src/assets/images).
    # In die Frontmatter wird exakt `../../assets/images/<datei>` geschrieben, wie Astro `image()` es erwartet.
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    files:
      - name: landing-page
        label: Startseite
        file: apps/website/src/content/landing-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: "Titel im Browser-Tab und in Suchergebnissen" }
          - { name: heroImage, label: Hero-Bild, widget: image, choose_url: false, accept: "image/*", hint: Hero-Bild für die Startseite }
          - { name: heroImageAlt, label: Hero-Bild Alt-Text, widget: string }
          - { name: logoImage, label: Logo-Bild, widget: image, choose_url: false, accept: "image/*", hint: Logo-Bild mit Pilzen }
          - { name: logoImageAlt, label: Logo-Bild Alt-Text, widget: string }
          - { name: heroTitle, label: Hero-Überschrift, widget: string }
          - { name: teaserText, label: Teaser-Text, widget: text }
          - name: values
            label: Werte-Karten
            widget: list
            min: 1
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titel (für Barrierefreiheit), widget: string, hint: "Text-Titel für Screen-Reader, wird nicht in der Überschrift angezeigt" }
              - name: headingSvg
                label: Überschrift SVG
                widget: image
                choose_url: false
                accept: .svg
                hint: SVG-Datei für die Überschrift
                media_folder: /apps/website/public/assets/headings
                public_folder: /assets/headings
              - { name: description, label: Beschreibung, widget: text, hint: "HTML (z.B. Links) ist erlaubt" }
          - name: mushroomShowcaseHeadingSvg
            label: Pilz-Showcase Überschrift SVG
            widget: image
            choose_url: false
            accept: .svg
            hint: SVG-Datei für die Pilz-Showcase Überschrift
            media_folder: /apps/website/public/assets/headings
            public_folder: /assets/headings
          - { name: mushroomShowcaseTitle, label: Pilz-Showcase Titel (für Barrierefreiheit), widget: string, hint: Text-Titel für Screen-Reader }
          - { name: mushroomShowcaseImage, label: Pilz-Showcase Bild, widget: image, choose_url: false, accept: "image/*", hint: Hochauflösendes Pilzbild }
          - { name: mushroomShowcaseImageAlt, label: Pilz-Showcase Bild Alt-Text, widget: string }
          - { name: mushroomShowcaseGrowingMethodsText, label: Pilz-Showcase Text, widget: text, required: false, hint: Kurzer Text über Anbaumethoden und Qualität }

      - name: about-us-page
        label: Über-uns-Seite
        file: apps/website/src/content/about-us-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroTitle, label: Haupt-Überschrift, widget: string }
          - { name: heroSubtitle, label: Untertitel, widget: string }
          - { name: images, label: Bilder-Galerie, widget: image, multiple: true, choose_url: false, accept: "image/*", hint: "Bilder aus dem Labor, Team-Fotos oder Pilzfotos" }
          - { name: body, label: Inhalt, widget: markdown, hint: "Text über das Team, Arbeitsweise, Werte etc." }

      - name: growkits-page
        label: Growkits-Seite
        file: apps/website/src/content/growkits-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroTitle, label: Haupt-Überschrift, widget: string }
          - { name: heroSubtitle, label: Untertitel, widget: string }
          - { name: heroImage, label: Hero-Bild, widget: image, choose_url: false, accept: "image/*" }
          - { name: heroImageAlt, label: Hero-Bild Alt-Text, widget: string }
          - { name: ctaTitle, label: CTA Überschrift, widget: string, hint: Überschrift für den Call-to-Action Bereich }
          - { name: ctaText, label: CTA Text, widget: text }
          - { name: ctaButtonText, label: CTA Button Text, widget: string, hint: 'z.B. "Kontakt aufnehmen"' }
          - { name: ctaButtonLink, label: CTA Button Link, widget: string, hint: 'z.B. "/kontakt/"' }
          - { name: body, label: Anleitung, widget: markdown, hint: Allgemeine Anleitung für alle Growkits }

      - name: faq-page
        label: FAQ-Seite
        file: apps/website/src/content/faq-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-Titel für die FAQ-Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - name: faqs
            label: FAQ-Einträge
            widget: list
            min: 1
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Frage, widget: string }
              - { name: answer, label: Antwort, widget: text, hint: "HTML (z.B. Links) ist erlaubt" }
              - { name: link, label: Link (optional), widget: string, required: false, hint: 'Link zu einer Seite mit mehr Informationen (z.B. "/growkits/")' }

      - name: gastronomie-page
        label: Gastronomie-Seite
        file: apps/website/src/content/gastronomie-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroTitle, label: Haupt-Überschrift, widget: string }
          - { name: heroSubtitle, label: Untertitel, widget: string, required: false }
          - { name: heroImage, label: Hero-Bild, widget: image, choose_url: false, accept: "image/*" }
          - { name: heroImageAlt, label: Hero-Bild Alt-Text, widget: string }
          - { name: introTitle, label: Einleitung Überschrift, widget: string }
          - { name: introText, label: Einleitung Text, widget: text }
          - { name: introText2, label: Einleitung Text 2, widget: text, required: false }
          - name: sorten
            label: Sorten
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Sortenname, widget: string }
              - { name: description, label: Beschreibung, widget: text }
          - name: vorteile
            label: Vorteile
            widget: list
            hint: "HTML ist erlaubt, z.B. <strong>Fett</strong>: Text"
            field: { name: vorteil, label: Vorteil, widget: text }
          - { name: ctaTitle, label: CTA Überschrift, widget: string }
          - { name: ctaText, label: CTA Text, widget: text }
          - { name: ctaButtonText, label: CTA Button Text, widget: string }
          - { name: ctaButtonLink, label: CTA Button Link, widget: string }
          - { name: ctaEmail, label: CTA E-Mail, widget: string, required: false }

      - name: tinkturen-page
        label: Tinkturen-Seite
        file: apps/website/src/content/tinkturen-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroTitle, label: Haupt-Überschrift, widget: string }
          - { name: heroSubtitle, label: Untertitel, widget: string, required: false }
          - { name: heroImage, label: Hero-Bild, widget: image, choose_url: false, accept: "image/*" }
          - { name: heroImageAlt, label: Hero-Bild Alt-Text, widget: string }
          - { name: introText, label: Einleitungstext, widget: text, hint: "Allgemeiner Einleitungstext (Herstellung, Dosierung etc.)" }
          - { name: disclaimerText, label: Disclaimer-Text, widget: text, hint: Rechtlicher Hinweis am Seitenende (HCVO-konform) }
          - name: tinctures
            label: Tinkturen auf dieser Seite
            widget: list
            summary: "{{fields.title}}"
            hint: Die Reihenfolge bestimmt die Anzeige-Reihenfolge.
            fields:
              - { name: title, label: Produktname, widget: string }
              - { name: botanicalName, label: Botanischer Name, widget: string }
              - { name: image, label: Produkt-Bild, widget: image, choose_url: false, accept: "image/*" }
              - { name: imageAlt, label: Bild Alt-Text, widget: string }
              - { name: color, label: Hintergrundfarbe, widget: string, required: false, hint: 'Hex-Farbe (z.B. "#b0b1f1")' }
              - { name: description, label: Beschreibung, widget: text, hint: 'HTML für Quellenverweise erlaubt, z.B. <sup><a href="#quelle-1">1</a></sup>' }
          - name: quellen
            label: Wissenschaftliche Quellen
            widget: list
            summary: "{{fields.title}}"
            hint: "Reihenfolge = Nummerierung (#quelle-1, #quelle-2, …)"
            fields:
              - { name: title, label: Quellenbezeichnung, widget: string }
              - { name: url, label: URL, widget: string }

  # ---------------------------------------------------------------------------
  # Ordner-Collections (mehrere Dateien, Anlegen erlaubt)
  # ---------------------------------------------------------------------------
  - name: mushrooms
    label: Pilzsorten
    label_singular: Pilzsorte
    icon: nutrition
    folder: apps/website/src/content/mushrooms
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: title, label: Pilzsorte, widget: string, hint: 'Name der Pilzsorte (z.B. "Austernpilze")' }
      - { name: image, label: Pilz-Bild, widget: image, choose_url: false, accept: "image/*" }
      - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
      - { name: color, label: Hintergrundfarbe, widget: string, required: false, hint: 'Farbe für den Textbox-Hintergrund (z.B. "#f5cbcd")' }
      - { name: order, label: Sortierung, widget: number, value_type: int, min: 1, default: 1, hint: "Reihenfolge auf der Seite (1, 2, 3, ...)" }
      - { name: body, label: Beschreibung, widget: markdown }

  - name: growkits
    label: Growkit-Sorten
    label_singular: Growkit
    icon: potted_plant
    folder: apps/website/src/content/growkits
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: title, label: Growkit-Name, widget: string, hint: "Name des Growkits (z.B. \"Lion's Mane Growkit\")" }
      - { name: image, label: Growkit-Bild, widget: image, choose_url: false, accept: "image/*" }
      - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
      - { name: color, label: Hintergrundfarbe, widget: string, required: false, hint: 'Farbe für den Abschnitt-Hintergrund (z.B. "#ffe4ec")' }
      - { name: order, label: Sortierung, widget: number, value_type: int, min: 1, default: 1, hint: "Reihenfolge auf der Seite (1, 2, 3, ...)" }
      - { name: body, label: Beschreibung, widget: markdown }

  - name: tinkturen
    label: Tinkturen-Produkte
    label_singular: Tinktur
    icon: science
    folder: apps/website/src/content/tinkturen
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: title, label: Produktname, widget: string, hint: "Name der Tinktur (z.B. \"Lion's Mane Extrakt\")" }
      - { name: botanicalName, label: Botanischer Name, widget: string, hint: 'z.B. "Hericium erinaceus · Igelstachelbart"' }
      - { name: image, label: Produkt-Bild, widget: image, choose_url: false, accept: "image/*" }
      - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
      - { name: color, label: Hintergrundfarbe, widget: string, required: false, hint: 'Farbe für den Abschnitt-Hintergrund (z.B. "#b0b1f1")' }
      - { name: order, label: Sortierung, widget: number, value_type: int, min: 1, default: 1, hint: "Reihenfolge auf der Seite (1, 2, 3, ...)" }
      - { name: body, label: Beschreibung, widget: markdown, hint: "Herstellung, Inhaltsstoffe und Wirkung (HCVO-konform formulieren)" }
