# Sveltia CMS Konfiguration für shroom-mates.de
# Doku: https://sveltiacms.app/en/docs
# Schema-Quelle der Wahrheit: src/content.config.ts (Zod) und src/content/**
# Alle Pfade sind relativ zum Repository-Root (Monorepo: apps/website/...).

backend:
  name: github
  repo: meister-eder/shroom-mates
  # TODO: auf `main` umstellen, sobald die Produktion live geht.
  branch: shop


# Ausgabe so nah wie möglich am bestehenden Stil halten (minimale Diffs):
# Strings in doppelten Anführungszeichen, leere optionale Felder weglassen
# (Zod `.optional()` akzeptiert nur fehlende Properties, keine leeren Strings).
output:
  omit_empty_optional_fields: true
  yaml:
    quote: double

slug:
  encoding: ascii
  clean_accents: true

# Fallback (wird von allen Collections unten überschrieben).
# Astro `image()` löst Bilder relativ zur Content-Datei auf, siehe media_folder je Collection.
media_folder: /apps/website/src/assets/images
public_folder: /assets/images

collections:
  # ---------------------------------------------------------------------------
  # Seiten (je eine Datei)
  # ---------------------------------------------------------------------------
  - name: pages
    label: Seiten
    label_singular: Seite
    icon: article
    # Relative Pfade: aufgelöst gegen den Ordner der jeweiligen Datei
    # (apps/website/src/content/<seite>/ + ../../assets/images = apps/website/src/assets/images).
    # In die Frontmatter wird exakt `../../assets/images/<datei>` geschrieben, wie Astro `image()` es erwartet.
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    files:
      - name: landing-page
        label: Startseite
        file: apps/website/src/content/landing-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: "Titel im Browser-Tab und in Suchergebnissen" }
          - { name: heroImage, label: Vorschaubild (Social Media), widget: image, choose_url: false, accept: "image/*", hint: "Erscheint nur als Vorschau beim Teilen des Links (og:image), nicht auf der Seite" }
          - { name: heroTitle, label: Hauptüberschrift, widget: string, hint: 'Der Name „shroom-mates“ wird hervorgehoben und bleibt in einer Zeile' }
          - { name: teaserText, label: Teaser-Text, widget: text, hint: "Einleitung unter der Überschrift, zugleich Meta-Beschreibung (SEO)" }
          - { name: heroEyebrow, label: Kleine Zeile über der Überschrift, widget: string }
          - { name: heroPrimaryButton, label: Hero-Button 1 (Pilze), widget: string }
          - { name: heroSecondaryButton, label: Hero-Button 2 (Growkits), widget: string }
          - { name: heroMascotAlt, label: Maskottchen Alt-Text, widget: string, hint: Beschreibung des Maskottchen-Bildes (Barrierefreiheit) }
          - { name: heroBubble, label: Sprechblase, widget: string }
          - name: steps
            label: Abschnitt „Von der Spore bis zur Ernte“
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Überschrift, widget: string }
              - { name: intro, label: Einleitung, widget: string }
              - name: items
                label: Schritte
                widget: list
                min: 4
                max: 4
                summary: "{{fields.title}}"
                hint: Genau vier Comic-Bilder, die Reihenfolge bestimmt die Nummerierung.
                fields:
                  - { name: title, label: Titel, widget: string }
                  - { name: text, label: Text, widget: text, hint: "HTML (z.B. Links) ist erlaubt" }
                  - { name: image, label: Bild, widget: image, choose_url: false, accept: "image/*", required: false, hint: Ohne Bild erscheint eine Farbfläche }
                  - { name: imageAlt, label: Bild Alt-Text, widget: string, required: false, hint: "Beschreibender Alt-Text, nur nötig wenn ein Bild gesetzt ist" }
          - name: products
            label: Abschnitt „Such dir was aus“
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Überschrift, widget: string }
              - name: items
                label: Karten
                widget: list
                min: 3
                max: 3
                summary: "{{fields.title}}"
                hint: "Drei Karten: Pilze, Growkits, Tinkturen (Farben sind fest je Position)"
                fields:
                  - { name: title, label: Titel, widget: string }
                  - { name: text, label: Text, widget: text }
                  - { name: link, label: Link, widget: string, hint: 'z.B. "/growkits/"' }
                  - { name: image, label: Bild, widget: image, choose_url: false, accept: "image/*" }
                  - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
          - name: gastro
            label: Abschnitt Gastronomie
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Kleine Zeile, widget: string }
              - { name: title, label: Überschrift, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: buttonText, label: Button-Text, widget: string }
              - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: "Beschreibt das Foto neben dem Text (Bild selbst ist im Template festgelegt)" }

      - name: about-us-page
        label: Über-uns-Seite
        file: apps/website/src/content/about-us-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroTitle, label: Kleine Zeile (Teil 1), widget: string, hint: 'Erscheint zusammen mit dem Untertitel als „Über uns – Die shroom-mates aus Leipzig“ über der Hauptzeile' }
          - { name: heroSubtitle, label: Kleine Zeile (Teil 2), widget: string }
          - { name: heroName, label: Hauptzeile, widget: string }
          - { name: heroEmmiAlt, label: Foto Emmi Alt-Text, widget: string }
          - { name: heroTimAlt, label: Foto Tim Alt-Text, widget: string }
          - name: timeline
            label: Zeitleiste
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Überschrift, widget: string }
              - name: items
                label: Stationen
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: year, label: Jahr, widget: string, required: false }
                  - { name: title, label: Titel, widget: string }
                  - { name: text, label: Text, widget: text }
                  - { name: image, label: Bild, widget: image, choose_url: false, accept: "image/*", required: false, hint: Ohne Bild erscheint eine Farbfläche }
                  - { name: imageAlt, label: Bild Alt-Text, widget: string, required: false, hint: "Beschreibender Alt-Text, nur nötig wenn ein Bild gesetzt ist" }
          - name: values
            label: Werte („Das ist uns wichtig“)
            widget: list
            summary: "{{fields.title}}"
            hint: Nummerierte Zeilen mit Foto
            fields:
              - { name: title, label: Titel, widget: string }
              - { name: text, label: Text, widget: text, hint: "HTML (z.B. Links) ist erlaubt" }
              - { name: image, label: Bild, widget: image, choose_url: false, accept: "image/*" }
              - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
          - name: where
            label: Abschnitt „Wo ihr uns findet“
            widget: object
            collapsed: true
            hint: Der Text darunter steht im Inhalt (Abschnitt „## Wo ihr uns findet“)
            fields:
              - { name: title, label: Überschrift, widget: string }
              - { name: address, label: Adresse, widget: string }
              - { name: routeButton, label: Button Route, widget: string }
              - { name: visitButton, label: Button Besuch, widget: string }
              - { name: imageAlt, label: Foto Alt-Text, widget: string }
          - { name: body, label: Inhalt, widget: markdown, hint: 'Die vier Abschnittsüberschriften (## Wer wir sind, ## Wie wir arbeiten, ## Das ist uns wichtig, ## Wo ihr uns findet) bestimmen die Platzierung und dürfen nicht umbenannt werden. Erlaubt: Absätze und Links.' }

      - name: growkits-page
        label: Growkits-Seite
        file: apps/website/src/content/growkits-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroTitle, label: Kleine Zeile über der Hauptzeile, widget: string, hint: Zugleich H1 der Seite }
          - { name: heroHeadline, label: Hauptzeile, widget: string }
          - { name: heroSubtitle, label: Einleitung, widget: text }
          - { name: heroPrimaryButton, label: Hero-Button 1, widget: string }
          - { name: heroSecondaryButton, label: Hero-Button 2, widget: string }
          - { name: heroImage, label: Hero-Bild, widget: image, choose_url: false, accept: "image/*" }
          - { name: heroImageAlt, label: Hero-Bild Alt-Text, widget: string }
          - { name: kitsTitle, label: Überschrift Kit-Auswahl, widget: string }
          - { name: kitDetailsLabel, label: Aufklapp-Titel je Kit, widget: string }
          - { name: kitShopButton, label: Shop-Button je Kit, widget: string }
          - { name: guideHarvestImageAlt, label: Anleitung Foto „Ernten“ Alt-Text, widget: string, hint: 'Foto beim Schritt, dessen Titel mit „Ernten“ beginnt' }
          - { name: ctaTitle, label: Abholen/Shop Überschrift, widget: string }
          - { name: ctaText, label: Abholen/Shop Text, widget: text }
          - { name: ctaShopButton, label: Shop-Button, widget: string }
          - { name: ctaButtonText, label: Kontakt-Button Text, widget: string, hint: 'z.B. "Kontakt aufnehmen"' }
          - { name: ctaButtonLink, label: Kontakt-Button Link, widget: string, hint: 'z.B. "/kontakt/"' }
          - { name: shippingLabel, label: Versand-Hinweis Titel, widget: string }
          - { name: shippingText, label: Versand-Hinweis Text, widget: text }
          - { name: body, label: Anleitung, widget: markdown, hint: 'Aufbau: „## Überschrift“, Einleitung, dann je Schritt „### 1. Titel“ mit Text (**fett** und *kursiv* erlaubt)' }

      - name: faq-page
        label: FAQ-Seite
        file: apps/website/src/content/faq-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-Titel für die FAQ-Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroEyebrow, label: Kleine Zeile über der Hauptzeile, widget: string, hint: Zugleich H1 der Seite }
          - { name: heroHeadline, label: Hauptzeile, widget: string }
          - { name: heroLead, label: Einleitung, widget: text }
          - { name: helpTitle, label: Hilfe-Box Überschrift, widget: string }
          - { name: helpText, label: Hilfe-Box Text, widget: string, hint: Steht direkt vor der E-Mail-Adresse }
          - { name: helpEmail, label: Hilfe-Box E-Mail, widget: string }
          - { name: helpButton, label: Hilfe-Box Button, widget: string, hint: Führt zur Kontaktseite }
          - { name: moreLinkText, label: Link-Text bei Antworten mit Link, widget: string, hint: 'z.B. "Mehr erfahren"' }
          - name: faqs
            label: FAQ-Einträge
            widget: list
            min: 1
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Frage, widget: string }
              - { name: answer, label: Antwort, widget: text, hint: "HTML (z.B. Links) ist erlaubt" }
              - { name: link, label: Link (optional), widget: string, required: false, hint: 'Link zu einer Seite mit mehr Informationen (z.B. "/growkits/")' }

      - name: gastronomie-page
        label: Gastronomie-Seite
        file: apps/website/src/content/gastronomie-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroEyebrow, label: Kleine Zeile über der Hauptzeile, widget: string, hint: Zugleich H1 der Seite }
          - { name: heroTitle, label: Hauptzeile, widget: string }
          - { name: heroSubtitle, label: Untertitel, widget: string, required: false }
          - { name: heroButton, label: Hero-Button, widget: string, hint: Springt zum Anfrage-Bereich }
          - name: heroPhotos
            label: Hero-Fotos
            widget: list
            min: 3
            max: 3
            summary: "{{fields.imageAlt}}"
            hint: Drei Fotos, das erste wird hochkant größer dargestellt
            fields:
              - { name: image, label: Bild, widget: image, choose_url: false, accept: "image/*" }
              - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
          - { name: heroImage, label: Vorschaubild (Social Media), widget: image, choose_url: false, accept: "image/*", hint: "Erscheint nur als Vorschau beim Teilen des Links (og:image), nicht auf der Seite" }
          - { name: introTitle, label: Einleitung Überschrift, widget: string }
          - { name: introText, label: Einleitung Text, widget: text }
          - { name: introText2, label: Einleitung Text 2, widget: text, required: false }
          - { name: sortenTitle, label: Sorten Überschrift, widget: string }
          - name: sorten
            label: Sorten
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Sortenname, widget: string }
              - { name: description, label: Beschreibung, widget: text }
              - { name: image, label: Bild, widget: image, choose_url: false, accept: "image/*" }
              - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
          - { name: vorteileTitle, label: Vorteile Überschrift, widget: string }
          - name: vorteile
            label: Vorteile
            widget: list
            hint: "HTML ist erlaubt, z.B. <strong>Fett</strong>: Text"
            field: { name: vorteil, label: Vorteil, widget: text }
          - { name: ctaTitle, label: CTA Überschrift, widget: string }
          - { name: ctaText, label: CTA Text, widget: text }
          - { name: ctaButtonText, label: CTA Button Text, widget: string }
          - { name: ctaButtonLink, label: CTA Button Link, widget: string }
          - { name: ctaEmail, label: CTA E-Mail, widget: string, required: false }

      - name: tinkturen-page
        label: Tinkturen-Seite
        file: apps/website/src/content/tinkturen-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroTitle, label: Kleine Zeile über der Hauptzeile, widget: string, hint: Zugleich H1 der Seite }
          - { name: heroHeadline, label: Hauptzeile, widget: string }
          - { name: heroImage, label: Vorschaubild (Social Media), widget: image, choose_url: false, accept: "image/*", hint: "Erscheint nur als Vorschau beim Teilen des Links (og:image), nicht auf der Seite" }
          - { name: heroPhotoAlt, label: Hero-Foto Alt-Text, widget: string, hint: "Beschreibt das Foto neben der Überschrift (Bild selbst ist im Template festgelegt)" }
          - { name: introText, label: Einleitungstext, widget: text, hint: "Allgemeiner Einleitungstext (Herstellung, Dosierung etc.)" }
          - name: facts
            label: Eckdaten
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { name: label, label: Bezeichnung, widget: string }
              - { name: value, label: Wert, widget: string }
          - name: tinctures
            label: Tinkturen auf dieser Seite
            widget: list
            summary: "{{fields.title}}"
            hint: Die Reihenfolge bestimmt die Anzeige-Reihenfolge.
            fields:
              - { name: title, label: Produktname, widget: string }
              - { name: botanicalName, label: Botanischer Name, widget: string }
              - { name: image, label: Produkt-Bild, widget: image, choose_url: false, accept: "image/*" }
              - { name: imageAlt, label: Bild Alt-Text, widget: string }
              - { name: size, label: Füllmenge, widget: string, hint: 'z.B. "50 ml"' }
              - { name: description, label: Beschreibung, widget: text, hint: 'HTML für Quellenverweise erlaubt, z.B. <sup><a href="#quelle-1">1</a></sup>' }
          - { name: shopButton, label: Shop-Button (je Tinktur), widget: string }
          - name: process
            label: Abschnitt „Warum doppelt?“
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Überschrift, widget: string }
              - { name: intro, label: Einleitung, widget: text }
              - name: steps
                label: Schritte
                widget: list
                min: 5
                max: 5
                summary: "{{fields.title}}"
                hint: Genau fünf Schritte, die Reihenfolge bestimmt die Nummerierung.
                fields:
                  - { name: title, label: Titel, widget: string }
                  - { name: text, label: Text, widget: text }
          - { name: quellenTitle, label: Quellen Überschrift, widget: string }
          - name: quellen
            label: Wissenschaftliche Quellen
            widget: list
            summary: "{{fields.title}}"
            hint: "Reihenfolge = Nummerierung (#quelle-1, #quelle-2, …)"
            fields:
              - { name: title, label: Quellenbezeichnung, widget: string }
              - { name: url, label: URL, widget: string }
          - { name: disclaimerText, label: Disclaimer-Text, widget: text, hint: Rechtlicher Hinweis am Seitenende (HCVO-konform) }

      - name: mushrooms-page
        label: Pilze-Seite
        file: apps/website/src/content/mushrooms-page/content.md
        fields:
          - { name: title, label: Seitentitel (SEO), widget: string, hint: SEO-optimierter Titel für die Seite }
          - { name: description, label: Meta-Beschreibung (SEO), widget: text, hint: SEO-Beschreibung für Suchmaschinen }
          - { name: heroEyebrow, label: Kleine Zeile über der Hauptzeile, widget: string, hint: Zugleich H1 der Seite }
          - { name: heroTitle, label: Hauptzeile, widget: string }
          - { name: heroLead, label: Einleitung, widget: text }
          - { name: heroImageAlt, label: Hero-Foto Alt-Text, widget: string, hint: "Beschreibt das Foto neben der Überschrift (Bild selbst ist im Template festgelegt)" }
          - { name: freshTag, label: Etikett „Frisch“, widget: string, hint: Kleines Etikett bei jeder Sorte }
          - { name: growkitLabel, label: Link-Text zum Growkit, widget: string, hint: Bei Sorten mit passendem Growkit im Shop }
          - { name: emptyText, label: Hinweis ohne Sorten, widget: string }
          - { name: bandText, label: Sprechblase im Bildband, widget: string }
          - name: ctas
            label: Hinweiskarten am Seitenende
            widget: list
            min: 2
            max: 2
            summary: "{{fields.title}}"
            hint: Zwei Karten (Farben sind fest je Position)
            fields:
              - { name: label, label: Kleine Zeile, widget: string }
              - { name: title, label: Titel, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: link, label: Link, widget: string, hint: 'z.B. "/kontakt/"' }

  # ---------------------------------------------------------------------------
  # Ordner-Collections (mehrere Dateien, Anlegen erlaubt)
  # ---------------------------------------------------------------------------
  - name: mushrooms
    label: Pilzsorten
    label_singular: Pilzsorte
    icon: nutrition
    folder: apps/website/src/content/mushrooms
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: title, label: Pilzsorte, widget: string, hint: 'Name der Pilzsorte (z.B. "Austernpilze")' }
      - { name: image, label: Pilz-Bild, widget: image, choose_url: false, accept: "image/*" }
      - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
      - { name: latinName, label: Lateinischer Name, widget: string, required: false, hint: 'z.B. "Pleurotus djamor"' }
      - { name: badge, label: Etikett auf dem Bild, widget: string, required: false, hint: 'z.B. "Nur im Sommer"' }
      - { name: order, label: Sortierung, widget: number, value_type: int, min: 1, default: 1, hint: "Reihenfolge auf der Seite (1, 2, 3, ...)" }
      - { name: body, label: Beschreibung, widget: markdown }

  - name: growkits
    label: Growkit-Sorten
    label_singular: Growkit
    icon: potted_plant
    folder: apps/website/src/content/growkits
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: title, label: Growkit-Name, widget: string, hint: "Name des Growkits (z.B. \"Lion's Mane Growkit\")" }
      - { name: image, label: Growkit-Bild, widget: image, choose_url: false, accept: "image/*" }
      - { name: imageAlt, label: Bild Alt-Text, widget: string, hint: Beschreibender Alt-Text (Barrierefreiheit) }
      - { name: order, label: Sortierung, widget: number, value_type: int, min: 1, default: 1, hint: "Reihenfolge auf der Seite (1, 2, 3, ...)" }
      - { name: body, label: Beschreibung, widget: markdown }
