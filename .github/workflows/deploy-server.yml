name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
  DEPLOY_PATH: /opt/shroom-mates
  COMPOSE_FILE: docker-compose.test.yml
  DOMAIN: ${{ secrets.DEPLOY_HOST }}.sslip.io

jobs:
  # ── Detect what changed ─────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      website_only: ${{ steps.check.outputs.website_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}
          fetch-depth: 2

      - name: Check if only website changed
        id: check
        run: |
          # Manual dispatch → always do a full deploy
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "website_only=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          printf "Changed files:\n%s\n" "$CHANGED"

          NON_WEBSITE=$(echo "$CHANGED" | grep -v '^apps/website/' | grep -v '^$' || true)
          if [ -z "$NON_WEBSITE" ] && [ -n "$CHANGED" ]; then
            echo "website_only=true" >> $GITHUB_OUTPUT
          else
            echo "website_only=false" >> $GITHUB_OUTPUT
          fi

  # ── Fast path: website-only deploy (no Docker restart) ─────
  deploy-website-only:
    needs: detect-changes
    if: needs.detect-changes.outputs.website_only == 'true'
    runs-on: ubuntu-latest
    environment: netcup-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run --filter @shroom-mates/website build
        env:
          PUBLIC_SHOP_URL: https://shop.${{ env.DOMAIN }}

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync website dist to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            apps/website/dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/apps/website/dist/"

      - name: Smoke test
        run: |
          sleep 3
          # Test server uses a self-signed certificate (Caddy `tls internal`)
          curl --insecure --fail --silent --show-error --max-time 15 "https://shroom-mates.$DOMAIN" > /dev/null
          echo "✓ Site is live"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ── Full-stack deploy ───────────────────────────────────────
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.website_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run --filter @shroom-mates/website build
        env:
          PUBLIC_SHOP_URL: https://shop.${{ env.DOMAIN }}

      - name: Build storefront
        run: bun run --filter @shroom-mates/storefront build
        env:
          PUBLIC_MEDUSA_BACKEND_URL: https://api.${{ env.DOMAIN }}
          PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
          PUBLIC_SITE_URL: https://shop.${{ env.DOMAIN }}

      - name: Install backend dependencies
        working-directory: backend
        run: bun install

      - name: Build backend
        working-directory: backend
        run: npx medusa build

      - name: Upload website dist
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist/
          retention-days: 1

  deploy-full:
    needs: build
    runs-on: ubuntu-latest
    environment: netcup-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Download website dist
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist/

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.turbo' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      # SumUp credentials come from the `netcup-test` environment secrets
      # (use a SumUp *sandbox* merchant there). Both must be set, so a lone
      # repository-level SUMUP_API_KEY is never copied onto the test server.
      - name: Sync SumUp credentials
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
        run: |
          if [ -z "$SUMUP_API_KEY" ] || [ -z "$SUMUP_MERCHANT_CODE" ]; then
            echo "::notice::SUMUP_API_KEY/SUMUP_MERCHANT_CODE not both set in the netcup-test environment — keeping the server's current SumUp credentials."
            exit 0
          fi
          printf 'SUMUP_API_KEY=%s\nSUMUP_MERCHANT_CODE=%s\n' "$SUMUP_API_KEY" "$SUMUP_MERCHANT_CODE" \
            | ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
                set -e
                cd /opt/shroom-mates
                touch .env
                grep -v -E "^(SUMUP_API_KEY|SUMUP_MERCHANT_CODE)=" .env > .env.tmp || true
                cat >> .env.tmp
                chmod 600 .env.tmp
                mv .env.tmp .env'
          echo "✓ SumUp credentials updated"

      - name: Sync email credentials
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY not set — the backend will only log emails."
            exit 0
          fi
          printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" \
            | ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
                set -e
                cd /opt/shroom-mates
                touch .env
                grep -v -E "^RESEND_API_KEY=" .env > .env.tmp || true
                cat >> .env.tmp
                chmod 600 .env.tmp
                mv .env.tmp .env'
          echo "✓ Resend API key updated"

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" << EOF
            cd /opt/shroom-mates
            export DOMAIN="$DEPLOY_HOST.sslip.io"
            export MEDUSA_PUBLISHABLE_KEY="${{ secrets.MEDUSA_PUBLISHABLE_KEY }}"
            docker compose -f $COMPOSE_FILE pull postgres redis caddy
            docker compose -f $COMPOSE_FILE build medusa storefront
            docker compose -f $COMPOSE_FILE up -d --remove-orphans --force-recreate
            echo "Waiting for health checks..."
            sleep 10
            docker compose -f $COMPOSE_FILE ps
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" << EOF
            cd /opt/shroom-mates
            unhealthy=$(docker compose -f $COMPOSE_FILE ps --format json | jq -r 'select(.Health != "healthy" and .Health != "") | .Name')
            if [ -n "$unhealthy" ]; then
              echo "⚠ Unhealthy services: $unhealthy"
              docker compose -f $COMPOSE_FILE logs --tail=30 $unhealthy
              exit 1
            fi
            echo "✓ All services healthy"
          EOF

      - name: Smoke test
        run: |
          # Self-signed certificate on the test server → --insecure
          check() {
            for i in $(seq 1 20); do
              if curl --insecure --fail --silent --max-time 10 -o /dev/null "$1"; then
                echo "✓ $1"; return 0
              fi
              sleep 6
            done
            echo "✗ $1 not reachable"; return 1
          }
          check "https://api.$DOMAIN/health"
          check "https://shop.$DOMAIN/de/store"
          check "https://shroom-mates.$DOMAIN"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
