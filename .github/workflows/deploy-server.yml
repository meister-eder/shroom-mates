# Deploys the server stack (docker-compose.yml + Caddyfile) to the netcup server.
# Until go-live it runs as staging under staging.shroom-mates.de; production is
# still GitHub Pages from `main`. Go-live = change the values under
# "Server environment" below (plus SumUp live keys in the environment secrets).
name: Deploy server

on:
  # Pushes to `shop` (code and CMS commits from Sveltia) deploy automatically
  # when they touch anything the server stack runs.
  push:
    branches: [shop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'backend/**'
      - 'bun.lock'
      - 'Caddyfile'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: shop
        type: string

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
  DEPLOY_PATH: /opt/shroom-mates
  # ── Server environment ──
  DOMAIN: staging.shroom-mates.de
  ROBOTS_TAG: noindex, nofollow
  ALLOW_MANUAL_PAYMENT: 'true'
  # Report-only until Astro's inline island scripts are covered by the CSP
  CSP_HEADER: Content-Security-Policy-Report-Only

jobs:
  # ── Build check (fails fast; the images are built on the server) ──
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run --filter @shroom-mates/web build
        env:
          PUBLIC_MEDUSA_BACKEND_URL: https://api.${{ env.DOMAIN }}
          PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
          PUBLIC_SITE_URL: https://${{ env.DOMAIN }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --cache /tmp/npm-cache-sm

      - name: Build backend
        working-directory: backend
        run: npx medusa build

  deploy-full:
    needs: build
    runs-on: ubuntu-latest
    environment: netcup-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.turbo' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      # SumUp credentials come from the `netcup-test` environment secrets
      # (use a SumUp *sandbox* merchant there). Both must be set, so a lone
      # repository-level SUMUP_API_KEY is never copied onto the test server.
      - name: Sync SumUp credentials
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
        run: |
          if [ -z "$SUMUP_API_KEY" ] || [ -z "$SUMUP_MERCHANT_CODE" ]; then
            echo "::notice::SUMUP_API_KEY/SUMUP_MERCHANT_CODE not both set in the netcup-test environment — keeping the server's current SumUp credentials."
            exit 0
          fi
          printf 'SUMUP_API_KEY=%s\nSUMUP_MERCHANT_CODE=%s\n' "$SUMUP_API_KEY" "$SUMUP_MERCHANT_CODE" \
            | ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
                set -e
                cd /opt/shroom-mates
                touch .env
                grep -v -E "^(SUMUP_API_KEY|SUMUP_MERCHANT_CODE)=" .env > .env.tmp || true
                cat >> .env.tmp
                chmod 600 .env.tmp
                mv .env.tmp .env'
          echo "✓ SumUp credentials updated"

      - name: Sync email credentials
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY not set — the backend will only log emails."
            exit 0
          fi
          printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" \
            | ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
                set -e
                cd /opt/shroom-mates
                touch .env
                grep -v -E "^RESEND_API_KEY=" .env > .env.tmp || true
                cat >> .env.tmp
                chmod 600 .env.tmp
                mv .env.tmp .env'
          echo "✓ Resend API key updated"

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" << EOF
            set -e
            cd ${DEPLOY_PATH}
            export DOMAIN="${DOMAIN}"
            export ROBOTS_TAG="${ROBOTS_TAG}"
            export ALLOW_MANUAL_PAYMENT="${ALLOW_MANUAL_PAYMENT}"
            export CSP_HEADER="${CSP_HEADER}"
            export MEDUSA_PUBLISHABLE_KEY="${{ secrets.MEDUSA_PUBLISHABLE_KEY }}"
            docker compose pull postgres redis caddy umami
            docker compose build medusa web
            docker compose up -d --remove-orphans --force-recreate || {
              docker compose ps -a
              docker compose logs --tail=60 medusa web
              exit 1
            }
          EOF

      # Quoted heredoc: everything below runs on the server, not on the runner.
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH} && DOMAIN=${DOMAIN} bash -s" << 'EOF'
            health() {
              docker compose ps --format json \
                | jq -r 'if type == "array" then .[] else . end | "\(.Name) \(.Health)"'
            }
            for i in $(seq 1 36); do
              health | grep -q ' starting$' || break
              sleep 5
            done
            docker compose ps
            unhealthy=$(health | awk '$2 != "healthy" && $2 != "" {print $1}')
            if [ -n "$unhealthy" ]; then
              echo "⚠ Unhealthy services: $unhealthy"
              for c in $unhealthy; do docker logs --tail=30 "$c"; done
              exit 1
            fi
            echo "✓ All services healthy"
          EOF

      - name: Smoke test
        run: |
          # Certificates are issued on first start, so allow a couple of minutes
          check() {
            for i in $(seq 1 20); do
              if curl --fail --silent --max-time 10 -o /dev/null "$1"; then
                echo "✓ $1"; return 0
              fi
              sleep 6
            done
            echo "✗ $1 not reachable"; return 1
          }
          check "https://api.$DOMAIN/health"
          check "https://$DOMAIN/shop/"
          check "https://$DOMAIN/"
          # Staging must stay out of search engines
          if [ "$ROBOTS_TAG" != "all" ]; then
            curl -sI "https://$DOMAIN/" | grep -qi '^x-robots-tag: noindex' \
              && echo "✓ noindex header" || { echo "✗ noindex header missing"; exit 1; }
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
