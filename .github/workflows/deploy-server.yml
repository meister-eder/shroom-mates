# Deploys to the netcup test server (docker-compose.test.yml, <host>.sslip.io).
# Production is still GitHub Pages from `main` (deploy.yml on main).
name: Deploy test server

on:
  # Pushes to `shop` (code and CMS commits from Sveltia) deploy automatically
  # when they touch anything the server stack runs.
  push:
    branches: [shop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'backend/**'
      - 'bun.lock'
      - 'Caddyfile.test'
      - 'docker-compose.test.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: shop
        type: string

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
  DEPLOY_PATH: /opt/shroom-mates
  COMPOSE_FILE: docker-compose.test.yml
  DOMAIN: ${{ secrets.DEPLOY_HOST }}.sslip.io

jobs:
  # ── Build check (fails fast; the images are built on the server) ──
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run --filter @shroom-mates/web build
        env:
          PUBLIC_MEDUSA_BACKEND_URL: https://api.${{ env.DOMAIN }}
          PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
          PUBLIC_SITE_URL: https://shroom-mates.${{ env.DOMAIN }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --cache /tmp/npm-cache-sm

      - name: Build backend
        working-directory: backend
        run: npx medusa build

  deploy-full:
    needs: build
    runs-on: ubuntu-latest
    environment: netcup-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.turbo' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      # SumUp credentials come from the `netcup-test` environment secrets
      # (use a SumUp *sandbox* merchant there). Both must be set, so a lone
      # repository-level SUMUP_API_KEY is never copied onto the test server.
      - name: Sync SumUp credentials
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
        run: |
          if [ -z "$SUMUP_API_KEY" ] || [ -z "$SUMUP_MERCHANT_CODE" ]; then
            echo "::notice::SUMUP_API_KEY/SUMUP_MERCHANT_CODE not both set in the netcup-test environment — keeping the server's current SumUp credentials."
            exit 0
          fi
          printf 'SUMUP_API_KEY=%s\nSUMUP_MERCHANT_CODE=%s\n' "$SUMUP_API_KEY" "$SUMUP_MERCHANT_CODE" \
            | ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
                set -e
                cd /opt/shroom-mates
                touch .env
                grep -v -E "^(SUMUP_API_KEY|SUMUP_MERCHANT_CODE)=" .env > .env.tmp || true
                cat >> .env.tmp
                chmod 600 .env.tmp
                mv .env.tmp .env'
          echo "✓ SumUp credentials updated"

      - name: Sync email credentials
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY not set — the backend will only log emails."
            exit 0
          fi
          printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" \
            | ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
                set -e
                cd /opt/shroom-mates
                touch .env
                grep -v -E "^RESEND_API_KEY=" .env > .env.tmp || true
                cat >> .env.tmp
                chmod 600 .env.tmp
                mv .env.tmp .env'
          echo "✓ Resend API key updated"

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" << EOF
            cd /opt/shroom-mates
            export DOMAIN="$DEPLOY_HOST.sslip.io"
            export MEDUSA_PUBLISHABLE_KEY="${{ secrets.MEDUSA_PUBLISHABLE_KEY }}"
            docker compose -f $COMPOSE_FILE pull postgres redis caddy
            docker compose -f $COMPOSE_FILE build medusa web
            docker compose -f $COMPOSE_FILE up -d --remove-orphans --force-recreate
            echo "Waiting for health checks..."
            sleep 10
            docker compose -f $COMPOSE_FILE ps
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" << EOF
            cd /opt/shroom-mates
            unhealthy=$(docker compose -f $COMPOSE_FILE ps --format json | jq -r 'select(.Health != "healthy" and .Health != "") | .Name')
            if [ -n "$unhealthy" ]; then
              echo "⚠ Unhealthy services: $unhealthy"
              docker compose -f $COMPOSE_FILE logs --tail=30 $unhealthy
              exit 1
            fi
            echo "✓ All services healthy"
          EOF

      - name: Smoke test
        run: |
          # Self-signed certificate on the test server → --insecure
          check() {
            for i in $(seq 1 20); do
              if curl --insecure --fail --silent --max-time 10 -o /dev/null "$1"; then
                echo "✓ $1"; return 0
              fi
              sleep 6
            done
            echo "✗ $1 not reachable"; return 1
          }
          check "https://api.$DOMAIN/health"
          check "https://shroom-mates.$DOMAIN/shop/"
          check "https://shroom-mates.$DOMAIN"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
